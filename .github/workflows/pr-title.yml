name: pr-title

# Checks that the PR title follows the conventional commits specification, which git-cliff relies on to generate the
# changelog (see cliff.toml), when it is used as a commit message (e.g. when squash merging).
on:
  # pull_request_target (rather than pull_request) also gives the token access to PRs from forks. It is safe here since
  # the code of the PR is never checked out.
  pull_request_target:
    types: [ edited, opened, reopened ]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Check the PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
