name: release

# Publishes a GitHub release, with the notes of the pushed version generated by git-cliff (see cliff.toml), when a
# version tag is pushed. CHANGELOG.md itself is updated before tagging, see the "Releasing" section of README.md.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # git-cliff needs the whole history to find the commits of the version.
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
