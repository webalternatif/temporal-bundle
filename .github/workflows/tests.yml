name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  mago:
    name: Mago (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.3", "8.4", "8.5" ]
    env:
      # Analyzes the code against the PHP version of the job instead of the one of mago.toml.
      MAGO_PHP_VERSION: ${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - name: Analyze
        run: composer analyze -- --reporting-format=github

      - name: Lint
        run: composer lint -- --reporting-format=github

      - name: Check formatting
        run: composer fmt-check

  composer-require-checker:
    name: Composer Require Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tool is installed as a PHAR rather than as a dev dependency: its latest version needs PHP 8.4+ and
      # symfony/console ^8, which would break the PHP 8.3 jobs and stop the tests on Symfony 6.4 and 7.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer-require-checker

      - uses: ramsey/composer-install@v3

      # Checks that each package used by the code is declared in composer.json, and not only installed because another
      # package requires it. The Doctrine symbols are allowed in composer-require-checker.json because Doctrine is
      # optional: DoctrineActivityResetter is registered only when DoctrineBundle is enabled.
      - name: Check the dependencies
        run: composer-require-checker check --config-file=composer-require-checker.json

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.3", "8.4", "8.5" ]
        # Lowest dependencies cover the oldest supported Symfony version (6.4), highest ones the latest.
        dependencies: [ lowest, highest ]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run PHPUnit
        run: composer phpunit

  infection:
    name: Infection (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.3", "8.4", "8.5" ]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Run Infection
        run: composer infection
        env:
          # Only one job publishes the mutation testing badge, so that jobs do not overwrite each other's report.
          STRYKER_DASHBOARD_API_KEY: ${{ matrix.php-version == '8.5' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
