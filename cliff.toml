# git-cliff configuration, see https://git-cliff.org/docs/configuration
#
# Only user-facing changes (features, fixes, performance improvements and breaking changes) end up in the changelog.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file, which is generated by [git-cliff](https://git-cliff.org)
from [conventional commits](https://www.conventionalcommits.org).
"""
body = """
{% set repository = "https://github.com/webalternatif/temporal-bundle" %}
{% if version -%}
## {{ version }} ({{ timestamp | date(format="%B %-d, %Y") }})
{% else -%}
{% set next_version = get_env(name="NEXT_VERSION", default="") -%}
## {% if next_version %}{{ next_version }} (unreleased){% else %}Unreleased{% endif %}
{% endif %}
{% if not previous.version -%}
First release 🎉
{%- else -%}
{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}
{% for commit in commits %}
* {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- if commit.message is not containing("/pull/") %} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repository }}/commit/{{ commit.id }}))
{%- endif %}
{%- endfor %}
{%- endfor %}
{%- endif %}
"""
# Removes leading and trailing whitespaces of the rendered releases, which are then separated by a blank line.
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_preprocessors = [
    # Links the pull request of squash merged commits, e.g. "feat: add something (#42)".
    { pattern = "\\s*\\(#([0-9]+)\\)$", replace = " ([#${1}](https://github.com/webalternatif/temporal-bundle/pull/${1}))" },
]
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    # HTML comments order the groups, they are stripped from the rendered titles.
    { field = "breaking", pattern = "true", group = "<!-- 0 -->💥 Breaking changes" },
    { message = "^feat", group = "<!-- 1 -->✨ New features" },
    { message = "^fix", group = "<!-- 2 -->🐛 Bug fixes" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance improvements" },
    { message = ".*", skip = true },
]

[bump]
initial_tag = "v0.1.0"
# Before 1.0.0, breaking changes bump the minor version and features the patch version.
breaking_always_bump_major = false
features_always_bump_minor = false
